# ============================================================
# MANGOWM KEY BINDINGS
#
# Philosophy:
#   Ctrl / Alt -> applications
#   Super      -> global compositor shortcuts
#   Super+w    -> enter MangoWM control mode
#
# Key mode hierarchy:
#
#   default
#      |
#      +-- Super+w --> wm
#                       |
#                       +-- r --> resize
#                       +-- m --> move
#                       +-- t --> tags
#                       +-- g --> gaps
#
# Escape in a submode -> wm
# Escape in wm        -> default
# ============================================================


# ============================================================
# COMMON
#
# These bindings work regardless of the current key mode.
# ============================================================

keymode=common


# ------------------------------------------------------------
# MangoWM
# ------------------------------------------------------------



# ------------------------------------------------------------
# Basic focus
# ------------------------------------------------------------

bind=SUPER,Tab,focusstack,next
bind=SUPER,u,focuslast

# ------------------------------------------------------------
# Utility programs
# ------------------------------------------------------------

bind=SUPER,w,spawn,waypaper

bind=SUPER,p,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t ppm - | satty -f -

# bind=NONE,n,spawn,swaync-client -t

# bind=SHIFT,n,spawn,swaync-client -C

# ------------------------------------------------------------
# Exchange tiled windows (tiling layout)
# ------------------------------------------------------------

bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right


# ------------------------------------------------------------
# Window state
# ------------------------------------------------------------

bind=SUPER,g,toggleglobal,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized


# ------------------------------------------------------------
# Scroller layout
# ------------------------------------------------------------

bind=ALT+SUPER+CTRL,Left,scroller_stack,left
bind=ALT+SUPER+CTRL,Right,scroller_stack,right
bind=ALT+SUPER+CTRL,Up,scroller_stack,up
bind=ALT+SUPER+CTRL,Down,scroller_stack,down


# ------------------------------------------------------------
# Tile / layouts
# ------------------------------------------------------------

bind=SUPER,e,incnmaster,1
bind=SUPER,t,incnmaster,-1

bind=CTRL+SUPER,i,setlayout,tile
bind=CTRL+SUPER,l,setlayout,scroller
bind=SUPER+CTRL,c,setlayout,center_tile
bind=SUPER,n,switch_layout


# ------------------------------------------------------------
# Tag navigation
# ------------------------------------------------------------

bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0

bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0


# ------------------------------------------------------------
# Toggle tag membership
# ------------------------------------------------------------

bind=CTRL+SUPER,1,toggletag,1
bind=CTRL+SUPER,2,toggletag,2
bind=CTRL+SUPER,3,toggletag,3
bind=CTRL+SUPER,4,toggletag,4
bind=CTRL+SUPER,5,toggletag,5
bind=CTRL+SUPER,6,toggletag,6
bind=CTRL+SUPER,7,toggletag,7
bind=CTRL+SUPER,8,toggletag,8
bind=CTRL+SUPER,9,toggletag,9


# ------------------------------------------------------------
# Toggle visible tags
# ------------------------------------------------------------

bind=SUPER,1,toggleview,1
bind=SUPER,2,toggleview,2
bind=SUPER,3,toggleview,3
bind=SUPER,4,toggleview,4
bind=SUPER,5,toggleview,5
bind=SUPER,6,toggleview,6
bind=SUPER,7,toggleview,7
bind=SUPER,8,toggleview,8
bind=SUPER,9,toggleview,9


# ------------------------------------------------------------
# Mouse
# ------------------------------------------------------------

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen

# Changed from NONE+middle-click.
#
# Unmodified middle-click is useful to applications, including Emacs.
mousebind=SUPER+SHIFT,btn_middle,togglemaximizescreen,0

# ------------------------------------------------------------
# Touchpad gestures
# ------------------------------------------------------------

gesturebind=NONE,left,3,focusdir,left
gesturebind=NONE,right,3,focusdir,right
gesturebind=NONE,up,3,focusdir,up
gesturebind=NONE,down,3,focusdir,down

gesturebind=NONE,left,4,viewtoleft_have_client
gesturebind=NONE,right,4,viewtoright_have_client
gesturebind=NONE,up,4,toggleoverview,1
gesturebind=NONE,down,4,toggleoverview,1


# ------------------------------------------------------------
# Media / brightness
# ------------------------------------------------------------

bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute

bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down


# ------------------------------------------------------------
# Noctalia
# ------------------------------------------------------------

bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER,p,spawn,noctalia msg media toggle


# ------------------------------------------------------------
# Applications
# ------------------------------------------------------------

bind=SUPER,Return,spawn,waterfox
bind=CTRL+SUPER,Return,spawn,kitty
# bind=SUPER,h,spawn,vibepanel


# ============================================================
# DEFAULT MODE
# ============================================================

keymode=default


# Enter MangoWM mode
bind=SUPER,Escape,setkeymode,wm

bind=SUPER+SHIFT,r,reload_config
bind=SUPER,m,quit
bind=SUPER,q,killclient

# ------------------------------------------------------------
# Focus with arrow keys
# ------------------------------------------------------------

bind=SUPER,left,focusdir,left
bind=SUPER,down,focusdir,down
bind=SUPER,up,focusdir,up
bind=SUPER,right,focusdir,right

# ------------------------------------------------------------
# Exchange clients
# ------------------------------------------------------------

bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,down,exchange_client,down
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,right,exchange_client,right

# ------------------------------------------------------------
# Window state
# ------------------------------------------------------------

bind=SUPER,Tab,togglejump

bind=SUPER,c,togglefloating

bind=SUPER,a,togglemaximizescreen,

bind=SUPER,f,togglefullscreen,

bind=SUPER+SHIFT,f,togglefakefullscreen,

bind=SUPER,z,toggle_scratchpad


# ------------------------------------------------------------
# Scroller
# ------------------------------------------------------------

bind=SUPER,e,set_proportion,1.0

bind=SUPER,x,switch_proportion_preset,
bind=SUPER+SHIFT,x,switch_proportion_preset,prev


# ------------------------------------------------------------
# Dwindle
# ------------------------------------------------------------

bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction


# ------------------------------------------------------------
# Tile
# ------------------------------------------------------------

bind=SUPER,s,zoom,

# -------------------------------------------------------------
# Tags
# -------------------------------------------------------------

# View tag
bind=SUPER+SHIFT,1,view,1,0
bind=SUPER+SHIFT,2,view,2,0
bind=SUPER+SHIFT,3,view,3,0
bind=SUPER+SHIFT,4,view,4,0
bind=SUPER+SHIFT,5,view,5,0
bind=SUPER+SHIFT,6,view,6,0
bind=SUPER+SHIFT,7,view,7,0
bind=SUPER+SHIFT,8,view,8,0
bind=SUPER+SHIFT,9,view,9,0


# Send client to tag
bind=SUPER+ALT,1,tag,1,0
bind=SUPER+ALT,2,tag,2,0
bind=SUPER+ALT,3,tag,3,0
bind=SUPER+ALT,4,tag,4,0
bind=SUPER+ALT,5,tag,5,0
bind=SUPER+ALT,6,tag,6,0
bind=SUPER+ALT,7,tag,7,0
bind=SUPER+ALT,8,tag,8,0
bind=SUPER+ALT,9,tag,9,0


# Previous / next populated tag
bind=SUPER+CTRL+ALT,h,viewtoleft_have_client,0
bind=SUPER+CTRL+ALT,l,viewtoright_have_client,0

# ============================================================
# WM MODE
#
# Enter with:
#
#     Super+Escape
#
# Leave with:
#
#     Escape
#
# ============================================================

keymode=wm


# ------------------------------------------------------------
# Leave mode
# ------------------------------------------------------------

bind=NONE,Escape,setkeymode,default
bind=SUPER,Escape,setkeymode,default

# ------------------------------------------------------------
# Enter specialized modes
# ------------------------------------------------------------

bind=NONE,r,setkeymode,resize
bind=NONE,m,setkeymode,move
bind=NONE,t,setkeymode,tags
bind=NONE,g,setkeymode,gaps


# ============================================================
# RESIZE MODE
#
# Super+w r
#
# h/j/k/l resize by 50 px
# Escape -> WM mode
# Enter  -> default mode
# ============================================================

keymode=resize

bind=NONE,h,resizewin,-50,+0
bind=NONE,l,resizewin,+50,+0
bind=NONE,k,resizewin,+0,-50
bind=NONE,j,resizewin,+0,+50

bind=NONE,Escape,setkeymode,wm
bind=NONE,Return,setkeymode,default
bind=SUPER,w,setkeymode,default


# ============================================================
# MOVE MODE
#
# Super+w m
#
# Intended primarily for floating windows.
# ============================================================

keymode=move

bind=NONE,h,movewin,-50,+0
bind=NONE,l,movewin,+50,+0
bind=NONE,k,movewin,+0,-50
bind=NONE,j,movewin,+0,+50

bind=NONE,Escape,setkeymode,wm
bind=NONE,Return,setkeymode,default
bind=SUPER,w,setkeymode,default

# ============================================================
# GAPS MODE
#
# Super+w g
#
# + / = -> increase gap
# -     -> decrease gap
# r     -> toggle gaps
# ============================================================

keymode=gaps

bind=NONE,equal,incgaps,1
bind=NONE,minus,incgaps,-1
bind=NONE,r,togglegaps

bind=NONE,Escape,setkeymode,wm
bind=NONE,Return,setkeymode,default
bind=SUPER,w,setkeymode,default

# ============================================================
# Reset parser state.
#
# Used in case there's other bindings in another config file
# after this one.
# ============================================================

keymode=default
