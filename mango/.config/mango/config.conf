# Effect
blur = 1
blur_layer = 0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.1
layer_animations = 0

shadows = 1
layer_shadows = 0
shadow_only_floating=1
shadows_size = 8
shadows_blur = 12
shadows_position_x = 0
shadows_position_y = 2
shadows_color = 0x2e3440ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity = 0.80

# Animation Configuration
animations=1
layer_animations=1
animation_type_open = fade
animation_type_close = fade
layer_animation_type_open = slide
layer_animation_type_close=slide 
animation_fade_in=1
animation_fade_out=1
tag_animation_direction = 1
zoom_initial_ratio=0.4
zoom_end_ratio=0.7
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=400
animation_curve_open = 0.25,1,0.5,1
animation_curve_move = 0.25,0.1,0.25,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.58,0.98,0.58,0.98
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
smart_gaps=0
default_master_factor=0.55
default_master_count=1

#Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
# ov_tab_mode = 0
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=1
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,scroller
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Adwaita
cursor_hide_timeout = 25
drag_tile_to_tile=1
single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on = 0
xkb_rules_layout=br
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
# disable_while_typing=1
# left_handed=0
# middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0
# scroll_button=274
# scroll_method=1

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=15
gap_outer_vertical=15
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px = 0
root_color = 0x2e3440ff
border_color = 0x707d99ff
focus_color = 0x8fbcbbff
drop_color = 0x8fbcbb80
split_color = 0x5e81acff
maximized_screen_color = 0x88c0d0ff
urgent_color = 0xbf616aff
scratchpad_color = 0x5e81acff
global_color = 0x2e6b69ff
overlay_color = 0x226e83ff

# sub config load
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf
source=~/.config/mango/noctalia.conf

# run autostart
exec_once=~/.config/mango/autostart.sh
# exec_once=waypaper --restore
# exec_once=vibepanel

# Group bar
group_bar_decorate_bg_color = 0x444c5eff
group_bar_decorate_border_color = 0x707d99ff
group_bar_decorate_fg_color = 0xeceff4ff
group_bar_decorate_focus_bg_color = 0x8fbcbbff
group_bar_decorate_focus_fg_color = 0x2e3440ff

# Group label
jump_label_decorate_bg_color = 0x444c5eff
jump_label_decorate_border_color = 0x707d99ff
jump_label_decorate_fg_color = 0xeceff4ff
jump_label_decorate_focus_bg_color = 0x8fbcbbff
jump_label_decorate_focus_fg_color = 0x2e3440ff
group_bar_decorate_border_width = 2

# Tag settings
tag_num = 6
tag_carousel = 1
allow_lock_transparent = 1
allow_tearing = 0
